workflows:
  default-workflow:
    name: Kolne App Production APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Clean and Create Android
        script: |
          flutter clean
          flutter create . --platforms=android
          flutter pub get
      - name: Fix Gradle and Build
        script: |
          cd android
          ./gradlew clean
          cd ..
          flutter build apk --debug --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
