workflows:
  default-workflow:
    name: Kolne APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Build APK
        script: |
          flutter clean
          rm -rf android
          flutter create . --platforms=android
          flutter pub get
          flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
