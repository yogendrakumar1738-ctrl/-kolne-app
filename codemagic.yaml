workflows:
  kolne-apk:
    name: KOLNE Real APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Fix Android v1 embedding
        script: |
          rm -rf android
          flutter create . --platforms=android --org com.example --project-name kolne
      - name: Get packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
