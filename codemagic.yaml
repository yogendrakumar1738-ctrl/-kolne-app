workflows:
  default-workflow:
    name: Kolne App Production APK
    max_build_duration: 15
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    triggering:
      events:
        - push
    scripts:
      - name: Automatic Android Native Builder
        script: |
          echo "Generating clean base configuration framework..."
          rm -rf android
          flutter create . --platforms android
      - name: Production Release Builder Engine
        script: |
          echo "Injecting automatic build configurations..."
          flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
