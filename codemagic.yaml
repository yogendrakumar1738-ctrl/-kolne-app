workflows:
  kolne-apk:
    name: Kolne APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: 3.22.2
      java: 17
    scripts:
      - name: Remove Broken FFmpeg
        script: |
          rm -rf android
          flutter create . --platforms=android
          echo "Removing broken ffmpeg package..."
          sed -i.bak '/ffmpeg/d' pubspec.yaml || sed -i '/ffmpeg/d' pubspec.yaml
          echo "Removing ffmpeg code from lib..."
          find lib -type f -name "*.dart" -exec sed -i.bak '/ffmpeg/d' {} \; -exec sed -i.bak '/FFmpeg/d' {} \; -exec sed -i.bak '/FFprobe/d' {} \; || find lib -type f -name "*.dart" -exec sed -i '/ffmpeg/d' {} \; -exec sed -i '/FFmpeg/d' {} \; -exec sed -i '/FFprobe/d' {} \; || true
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
      - name: Get Packages
        script: |
          flutter clean
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - yogendrakumar1738@gmail.com
