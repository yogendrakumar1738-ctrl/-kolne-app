workflows:
  kolne-apk:
    name: Kolne APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: 3.22.2
      java: 17
    scripts:
      - name: Nuke Broken Code
        script: |
          rm -rf android
          flutter create . --platforms=android
          echo "Deleting ffmpeg files..."
          grep -r -l "ffmpeg\|FFmpeg\|watermark" lib --include="*.dart" | xargs rm -f || true
          sed -i.bak '/ffmpeg/d' pubspec.yaml || sed -i '/ffmpeg/d' pubspec.yaml
          find lib -type f -name "*.dart" -exec sed -i.bak '/watermark/d; /ffmpeg/d' {} \; || find lib -type f -name "*.dart" -exec sed -i '/watermark/d; /ffmpeg/d' {} \; || true
          echo "android.useAndroidX=true" >> android/gradle.properties
      - name: Get Packages
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release --no-tree-shake-icons -v
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - yogendrakumar1738@gmail.com
