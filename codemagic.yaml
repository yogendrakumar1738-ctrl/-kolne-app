workflows:
  android-apk:
    name: Android APK Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    scripts:
      - name: Fix Android v1 embedding
        script: |
          rm -rf android
          sed -i '' 's/^name:.*/name: kolne/' pubspec.yaml || sed -i 's/^name:.*/name: kolne/' pubspec.yaml
          flutter create . --platforms=android --project-name kolne
      - name: Build APK
        script: |
          flutter pub get
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - yogendrakumar1738@gmail.com
