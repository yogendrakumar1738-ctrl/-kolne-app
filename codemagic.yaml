workflows:
  kolne-apk:
    name: Kolne APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: 3.22.2
      java: 17
    scripts:
      - name: Fix Everything
        script: |
          rm -rf android
          flutter create . --platforms=android
          echo "Fixing Dart imports..."
          find lib -type f -name "*.dart" -print -exec sed -i "s/ffmpeg_kit_flutter/ffmpeg_kit_flutter_new/g" {} \; || true
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
      - name: Get Packages
        script: |
          flutter clean
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - yogendrakumar1738@gmail.com
